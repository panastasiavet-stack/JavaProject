services:
  postgres:
    image: postgres:17
    container_name: otp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: otp_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - otp_postgres_data:/var/lib/postgresql/data

volumes:
  otp_postgres_data: